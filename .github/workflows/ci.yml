name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Testar
        run: python -m unittest discover -s testes -t . -v

      - name: Recalcular as tabelas do README
        run: python -m ferramentas.medidor

  vinte_mil_termos:
    # A varredura funda, com vinte mil termos: fica num job proprio para nao
    # multiplicar o custo pela matriz de nove combinacoes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Vinte mil termos, e o lambda procurado de novo
        run: python -m ferramentas.medidor --completo
